<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Autonomous Agent Dashboard</h1>
    </header>
    <main>
        <section id="dashboard">
            <h2>Dashboard</h2>
            <div id="agent-stats">
                <h3>Agent Statistics</h3>
                <p id="status">Status: <span>Active</span></p>
                <p id="uptime">Uptime: <span>10 hours</span></p>
            </div>
            <div id="controls">
                <h3>Controls</h3>
                <button id="start">Start</button>
                <button id="stop">Stop</button>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Autonomous Agent Dashboard</p>
    </footer>
</body>
</html>
